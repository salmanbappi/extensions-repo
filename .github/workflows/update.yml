name: Update Repo Index (Manual)

# This workflow is a MANUAL FALLBACK only.
# The sb-extensions-source publish job is the authoritative
# index generator (uses Inspector.jar + create-repo.py).
# Only trigger this manually if the index needs to be rebuilt
# without a full extension build.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Generate Repo Index
        run: python generate_repo.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.min.json repo.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: update repo index (manual)"
          git push --force-with-lease
